name: Build Release Binaries

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build for Linux (.AppImage)'
        type: boolean
        default: true
      build_mac:
        description: 'Build for macOS (.dmg) - Requires certs'
        type: boolean
        default: false
      build_windows:
        description: 'Build for Windows (.exe)'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: BarnOwl-AI-linux
            should_run: ${{ inputs.build_linux }}
          - os: macos-latest
            platform: darwin/arm64
            artifact_name: BarnOwl-AI-mac-arm64
            should_run: ${{ inputs.build_mac }}
          - os: windows-latest
            platform: windows/amd64
            artifact_name: BarnOwl-AI-windows
            should_run: ${{ inputs.build_windows }}

    runs-on: ${{ matrix.os }}
    # Only run the job if the corresponding input was checked
    if: ${{ matrix.should_run == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Update if your project uses a different version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # TODO: macOS Code Signing & Notarization steps would go here
      # Needs APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_DEVELOPER_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD

      - name: Build Wails App
        working-directory: wails-app
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            wails-app/build/bin/*
          retention-days: 7
