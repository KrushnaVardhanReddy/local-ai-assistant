name: Build Release Binaries

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build for Linux (.AppImage)'
        type: boolean
        default: true
      build_mac:
        description: 'Build for macOS (.dmg) - Requires certs'
        type: boolean
        default: false
      build_windows:
        description: 'Build for Windows (.exe)'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: BarnOwl-AI-linux
            should_run: ${{ inputs.build_linux }}
          - os: macos-latest
            platform: darwin/arm64
            artifact_name: BarnOwl-AI-mac-arm64
            should_run: ${{ inputs.build_mac }}
          - os: windows-latest
            platform: windows/amd64
            artifact_name: BarnOwl-AI-windows
            should_run: ${{ inputs.build_windows }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        if: ${{ matrix.should_run == true || matrix.should_run == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Go
        if: ${{ matrix.should_run == true || matrix.should_run == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x' # Update if your project uses a different version

      - name: Setup Node.js
        if: ${{ matrix.should_run == true || matrix.should_run == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Setup MSYS2
        if: ${{ (matrix.should_run == true || matrix.should_run == 'true') && runner.os == 'Windows' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf

      - name: Install Wails
        if: ${{ matrix.should_run == true || matrix.should_run == 'true' }}
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Dependencies
        if: ${{ (matrix.should_run == true || matrix.should_run == 'true') && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # TODO: macOS Code Signing & Notarization steps would go here
      # Needs APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_DEVELOPER_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD


      - name: Build Wails App (Linux/macOS)
        if: ${{ (matrix.should_run == true || matrix.should_run == 'true') && runner.os != 'Windows' }}
        working-directory: wails-app
        env:
          C_INCLUDE_PATH: ${{ github.workspace }}/wails-app/backend/lib
          LIBRARY_PATH: ${{ github.workspace }}/wails-app/backend/lib
          CGO_CFLAGS: "-I${{ github.workspace }}/wails-app/backend/lib"
          CGO_LDFLAGS: "-L${{ github.workspace }}/wails-app/backend/lib -lwhisper -lstdc++ -lm"
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Build Wails App (Windows)
        if: ${{ (matrix.should_run == true || matrix.should_run == 'true') && runner.os == 'Windows' }}
        working-directory: wails-app
        shell: msys2 {0}
        env:
          C_INCLUDE_PATH: ${{ github.workspace }}/wails-app/backend/lib
          LIBRARY_PATH: ${{ github.workspace }}/wails-app/backend/lib
          CGO_CFLAGS: "-I${{ github.workspace }}/wails-app/backend/lib"
          CGO_LDFLAGS: "-L${{ github.workspace }}/wails-app/backend/lib -lwhisper -lstdc++ -lm"
        run: wails build -platform ${{ matrix.platform }} -clean

      - name: Upload Artifact
        if: ${{ matrix.should_run == true || matrix.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            wails-app/build/bin/*
          retention-days: 7
