name: Build Windows Cloud EXE
on:
  workflow_dispatch:
  push:
    branches:
      - feature/krushna
    paths:
      - '.github/workflows/build-windows-cloud.yml'

jobs:
  build-cloud:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'


      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-x86_64-gcc

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Cloud Wails App
        working-directory: wails-app
        shell: msys2 {0}

        env:
          VITE_BUILD_FLAVOR: cloud
          C_INCLUDE_PATH: ${{ github.workspace }}/wails-app/backend/lib
          LIBRARY_PATH: ${{ github.workspace }}/wails-app/backend/lib
          CGO_CFLAGS: "-I${{ github.workspace }}/wails-app/backend/lib"
          CGO_LDFLAGS: "-L${{ github.workspace }}/wails-app/backend/lib -lwhisper -lstdc++ -lm"
        run: wails build

      - name: Upload Cloud Frontend EXE and MSI
        uses: actions/upload-artifact@v4
        with:
          name: stealth-assistant-cloud-exe-msi
          path: wails-app/build/bin/*.exe
