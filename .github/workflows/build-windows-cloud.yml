name: Build Windows Cloud EXE
on:
  workflow_dispatch:
  push:
    branches:
      - feature/krushna
    paths:
      - '.github/workflows/build-windows-cloud.yml'

jobs:
  build-cloud:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Cloud Wails App
        working-directory: wails-app
        env:
          VITE_BUILD_FLAVOR: cloud
        run: wails build

      - name: Upload Cloud Frontend EXE and MSI
        uses: actions/upload-artifact@v4
        with:
          name: stealth-assistant-cloud-exe-msi
          path: wails-app/build/bin/*.exe
