name: Build Windows EXE
on: [workflow_dispatch]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Build Python Backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --name "local-ai-backend-windows" --onefile --exclude-module tkinter --exclude-module matplotlib --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module IPython --exclude-module notebook --exclude-module pytest --exclude-module tensorboard --hidden-import fastapi --hidden-import uvicorn --hidden-import faster_whisper --hidden-import websockets --hidden-import sounddevice --hidden-import chromadb --hidden-import sentence_transformers app.py
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install
        
      - name: Build Tauri App
        working-directory: frontend
        run: npm run tauri build
        
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: stealth-assistant-windows-exe
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            backend/dist/local-ai-backend-windows.exe
